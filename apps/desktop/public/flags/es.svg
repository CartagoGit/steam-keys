<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 16" width="24" height="16" role="img" aria-label="Espana">
  <clipPath id="es-clip">
    <rect width="24" height="16" rx="1.5"/>
  </clipPath>
  <g clip-path="url(#es-clip)">
    <!-- Bandas 1:2:1, que es la proporcion oficial. Con las cuatro mismas
         partes la bandera se parece a Anyguy, que no es lo que queremos. -->
    <rect width="24" height="16" fill="#aa1519"/>
    <rect y="4" width="24" height="8" fill="#f1bf00"/>
    <!-- El escudo va desplazado hacia el astil, no centrado: centrado se ve
         una bandera generica con un manchon rojo en medio. -->
    <g transform="translate(9 0)">
      <!-- Corona: sin ella el escudo parece un rombo suelto. -->
      <path d="M0.5 6.6h3.2v-1l-0.6-0.7 0.9-0.6 0.6 0.6 0.6-0.6 0.9 0.6-0.6 0.7v1z"
            fill="#f1bf00"/>
      <rect x="0.5" y="6.2" width="3.2" height="0.5" fill="#f1bf00"/>
      <!-- Cuerpo del escudo, cuartelado como el real: solo se distinguen los
           dos colores a este tamano, que es lo unico que lo hace espanol. -->
      <rect x="0.4" y="6.9" width="1.6" height="1.4" fill="#aa1519"/>
      <rect x="2" y="6.9" width="1.6" height="1.4" fill="#ad1519"/>
      <rect x="0.4" y="8.3" width="1.6" height="1.4" fill="#ad1519"/>
      <rect x="2" y="8.3" width="1.6" height="1.4" fill="#aa1519"/>
    </g>
  </g>
</svg>
