[package]
name = "steam-keys"
version = "1.0.0"
description = "Gestor local de keys de Steam"
authors = ["RelaxingCup"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "steam_keys_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Peticiones HTTP a la API de Steam. `ureq` es sincrono y sin dependencias de
# sistema, que es justo lo que hace falta para un comando de Tauri que se
# ejecuta una vez al conectar la cuenta.
ureq = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
